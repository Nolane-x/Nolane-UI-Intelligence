            .nui-v6-payload/part-17a .nui-v6-payload/part-17b .nui-v6-payload/part-17c .nui-v6-payload/part-18a \
            > /tmp/nui-v6.patch.xz.b64
          echo "a7996371f9175b3db91768389d0b719eb9ae1677a2a34f3ccf13e4afb973680a  /tmp/nui-v6.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/nui-v6.patch.xz.b64 > /tmp/nui-v6.patch.xz
          echo "6a9db52e42ab72a7767a861ed0a2211687b77fd87a98170ba57d18539f3d1ade  /tmp/nui-v6.patch.xz" | sha256sum -c -
          xz -dc /tmp/nui-v6.patch.xz > /tmp/nui-v6.patch
          git apply --check /tmp/nui-v6.patch
          git apply /tmp/nui-v6.patch
          # Keep workflow files unchanged for this Actions-token push. They are finalized through the GitHub connector after source materialization.
          git checkout HEAD -- .github/workflows/verify.yml .github/workflows/nui-v6-bootstrap.yml
          rm -rf .nui-v6-payload .nui-v6-ready
          git config user.name "Nolane v6 bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: NUI v6 Deep Research & Design Synthesis"
          git push origin "HEAD:${GITHUB_REF_NAME}"
