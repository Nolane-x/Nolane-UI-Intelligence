name: NUI v6 bootstrap

on:
  push:
    paths:
      - '.nui-v6-ready'

permissions:
  contents: write

jobs:
  materialize-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply verified v6 patch without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nui-v6-parts.sha256 <<'EOF'
