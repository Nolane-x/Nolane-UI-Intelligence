name: NUI v6 bootstrap

on:
  push:
    paths:
      - '.nui-v6-ready'

permissions:
  contents: write

jobs:
  materialize-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct verified v6 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .nui-v6-payload/part-* > /tmp/nui-v6.tar.xz.b64
          echo "645827f6285308483c6881c081274555808969b86860af37a47d2d0c96793647  /tmp/nui-v6.tar.xz.b64" | sha256sum -c -
          base64 -d /tmp/nui-v6.tar.xz.b64 > /tmp/nui-v6.tar.xz
          echo "c03caddebff157802ad26506ea7a5beb057a6f2134cc835ca845feb17d6eaf44  /tmp/nui-v6.tar.xz" | sha256sum -c -
          tar -xJf /tmp/nui-v6.tar.xz
          rm -rf .nui-v6-payload .nui-v6-ready .github/workflows/nui-v6-bootstrap.yml
          git config user.name "Nolane v6 bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: NUI v6 Deep Research & Design Synthesis"
          git push origin "HEAD:${GITHUB_REF_NAME}"
