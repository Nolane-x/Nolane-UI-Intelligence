name: NUI v6 direct rescue

on:
  push:
    branches:
      - build/deep-research-design-synthesis-v6
    paths:
      - .nui-v6-direct-ready

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact direct v6 commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin build/deep-research-design-synthesis-v6-direct
          DIRECT_SHA="$(git rev-parse FETCH_HEAD)"
          test "$DIRECT_SHA" = "a564d235707167153a11bcd6335ca3957aea1572"
          git reset --hard "$DIRECT_SHA"
          grep -q 'version = "0.6.0"' pyproject.toml

      - name: Verify exact v6 tree
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/nui-validate . --revision a564d235707167153a11bcd6335ca3957aea1572
          git diff --check

      - name: Replace integration branch with verified direct commit
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin a564d235707167153a11bcd6335ca3957aea1572:refs/heads/build/deep-research-design-synthesis-v6

      - name: Open PR if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head build/deep-research-design-synthesis-v6 --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head build/deep-research-design-synthesis-v6 \
              --title 'NUI v6: Deep Research & Design Synthesis Intelligence' \
              --body 'Deep source intelligence, repository archaeology, cross-source synthesis, full-graph semantic depth locks, industry ontology, causal skill-effect benchmarking, and v6 completion enforcement. Pre-PR verification: 184/184 tests PASS, nui-validate PASS, git diff --check clean.'
          fi
