name: NUI v6 exact-head automerge

on:
  push:
    branches:
      - build/deep-research-design-synthesis-v6
    paths:
      - .nui-v6-automerge-ready

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge-only-after-exact-ci:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: a564d235707167153a11bcd6335ca3957aea1572
      BRANCH: build/deep-research-design-synthesis-v6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for exact v6 branch materialization
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
            if [ "$remote_sha" = "$TARGET_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Exact v6 branch SHA did not materialize" >&2
          exit 1

      - name: Wait for PR on exact head
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number,headRefOid --jq 'map(select(.headRefOid == env.TARGET_SHA))[0].number // empty')"
            if [ -n "$pr" ]; then
              echo "number=$pr" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "No PR found on exact v6 SHA" >&2
          exit 1

      - name: Require successful verify workflow on exact PR head
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          for i in $(seq 1 90); do
            head="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            test "$head" = "$TARGET_SHA"
            success="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --commit "$TARGET_SHA" --workflow verify.yml --json event,conclusion,headSha --jq 'map(select(.headSha == env.TARGET_SHA and .conclusion == "success")) | length')"
            if [ "$success" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "verify.yml did not succeed on exact v6 SHA" >&2
          exit 1

      - name: Merge exact verified PR
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          head="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$head" = "$TARGET_SHA"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge
