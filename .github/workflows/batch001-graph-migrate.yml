name: Batch 001 Graph Migration

on:
  push:
    branches:
      - build/ui-industry-1000-batch-001
    paths:
      - scripts/batch001_graph_migration.py
      - .github/workflows/batch001-graph-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ui-industry-1000-batch-001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply explicit Batch 001 graph mapping
        run: python scripts/batch001_graph_migration.py

      - name: Validate Batch 001 acceptance
        run: PYTHONPATH=src python -m unittest tests.test_ui_industry_batch_001 -v

      - name: Commit canonical graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/skill-graph.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: integrate Batch 001 canonical graph"
          git push origin HEAD:build/ui-industry-1000-batch-001
