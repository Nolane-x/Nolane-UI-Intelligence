name: Batch 005 CI Contract Repair

on:
  push:
    branches:
      - build/ui-industry-1000-batch-005-research-first

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair monotonic and scalable test contracts
        run: python scripts/nui-batch-005-repair-ci
      - name: Verify only test files changed
        run: |
          git diff --check
          test -z "$(git diff --name-only | grep -v '^tests/' || true)"
      - name: Commit repaired test contracts
        run: |
          if git diff --quiet; then
            echo "No repair changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_clean_delivery_contract.py tests/test_ui_industry_batch_002.py tests/test_ui_industry_batch_003.py tests/test_ui_industry_batch_004.py tests/test_ui_industry_batch_005.py
          git commit -m "test: make batch gates monotonic and scalable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
