name: NUI v3 Bootstrap

on:
  push:
    branches:
      - build/ui-closure-intelligence-v3

permissions:
  contents: write

jobs:
  apply-verified-v3-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify deterministic payload
        shell: bash
        run: |
          set -euo pipefail
          cat .nui-v3-payload.part* | base64 -d > /tmp/nui-v3-payload.tar.gz
          echo "9e5b4c1bc7f43ba573f07b1f7f28fd630caaa81f2db6749c787ffa610886ac80  /tmp/nui-v3-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nui-v3-payload.tar.gz -C .
          rm -f .nui-v3-payload.part*
          rm -f .github/workflows/nui-v3-bootstrap.yml

      - name: Verify NUI v3 exact checkout
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v
          python scripts/nui-validate .

      - name: Commit clean verified v3 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NUI v3 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation delta to commit."
            exit 0
          fi
          git commit -m "feat: build NUI v3 product closure and visual intelligence"
          git push origin HEAD:${GITHUB_REF_NAME}
