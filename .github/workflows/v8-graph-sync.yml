name: V8 Graph Sync
on:
  push:
    branches: ["build/v8-rc-tests"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize reviewed v8 owners
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph_path=Path('skills/skill-graph.json')
          manifest_path=Path('knowledge/v8-skill-manifest.json')
          graph=json.loads(graph_path.read_text())
          manifest=json.loads(manifest_path.read_text())
          skills=graph['skills']
          for item in manifest['skills']:
              name=item['name']
              skills[name]={k:item[k] for k in ('family','parent','output','ownership')}
          if len(skills) != 174:
              raise SystemExit(f'expected 174 canonical skills, found {len(skills)}')
          graph_path.write_text(json.dumps(graph, indent=2, ensure_ascii=False)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add skills/skill-graph.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(v8): materialize canonical 174-skill graph"
          git push origin HEAD:build/v8-rc-tests
