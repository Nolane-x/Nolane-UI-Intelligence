name: Materialize V13 Wave 7

on:
  push:
    branches:
      - transport/v13-wave7

permissions:
  contents: write

concurrency:
  group: v13-wave7-transport
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport payload
        uses: actions/checkout@v4
        with:
          ref: transport/v13-wave7
          fetch-depth: 0

      - name: Reassemble and verify archive
        shell: bash
        env:
          EXPECTED_PATHS_B64: 
          SHA256SUMS_B64: 
        run: |
          set -euo pipefail
          cat .nui-transport/chunk-00 .nui-transport/chunk-01 .nui-transport/chunk-02 .nui-transport/chunk-03 .nui-transport/chunk-04 .nui-transport/chunk-05 .nui-transport/chunk-06 .nui-transport/chunk-07 | base64 --decode > /tmp/wave7.tar.gz
          echo '2ac82bd217feabec8944e8678c7b404cdfe4df138332ecc16d2d5804085f2c18  /tmp/wave7.tar.gz' | sha256sum --check --strict
          test "$(stat -c '%s' /tmp/wave7.tar.gz)" = '91055'
          printf '%s' "$EXPECTED_PATHS_B64" | base64 --decode > /tmp/expected-paths.txt
          tar -tzf /tmp/wave7.tar.gz | sort > /tmp/actual-paths.txt
          sort /tmp/expected-paths.txt -o /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          mkdir -p /tmp/wave7
          tar -xzf /tmp/wave7.tar.gz -C /tmp/wave7
          printf '%s' "$SHA256SUMS_B64" | base64 --decode > /tmp/SHA256SUMS
          (cd /tmp/wave7 && sha256sum --check --strict /tmp/SHA256SUMS)

      - name: Materialize exact bytes on target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v13-seventh-authored-wave
          test "$(git rev-parse origin/main)" = '5365ddeb92fef96529d36355587632452e137264'
          test "$(git rev-parse origin/v13-seventh-authored-wave)" = '5365ddeb92fef96529d36355587632452e137264'
          git checkout -B v13-seventh-authored-wave origin/v13-seventh-authored-wave
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/wave7/$path" "$path"
          done < /tmp/expected-paths.txt
          git diff --check

      - name: Install package
        run: python -m pip install -e .

      - name: Verify V13 regression and current-head validator
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_rules_v13*.py'
          python - <<'PY'
          from pathlib import Path
          from nolane_ui.validators import validate_repository
          from nolane_ui.rules_v13 import rule_catalog_status_v13
          root = Path('.')
          result = validate_repository(root)
          assert result['valid'], result
          status = rule_catalog_status_v13(root)
          assert status['valid'], status
          assert status['rule_count'] == 621, status
          assert status['provenance_record_count'] == 63, status
          assert status['duplicate_pair_count'] == 0, status
          assert status['boilerplate_cluster_count'] == 0, status
          print('wave7-validator', status)
          PY

      - name: Commit exact verified wave
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nolane V13 Transport'
          git config user.email 'actions@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/expected-paths.txt
          test -n "$(git status --porcelain)"
          git commit -m 'feat(v13): add seventh authored 160-rule wave'
          git push origin HEAD:v13-seventh-authored-wave
