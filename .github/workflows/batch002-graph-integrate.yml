name: Batch 002 Graph Integration

on:
  push:
    branches:
      - build/ui-industry-1000-batch-002
    paths:
      - .github/workflows/batch002-graph-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ui-industry-1000-batch-002

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate explicit Batch 002 graph metadata
        run: python scripts/batch002_graph_integrate.py

      - name: Run Batch 002 acceptance contract
        run: PYTHONPATH=src python -m unittest tests.test_ui_industry_batch_002 -v

      - name: Commit canonical graph only after acceptance passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/skill-graph.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate UI Industry Batch 002 into canonical graph"
          git push origin HEAD:build/ui-industry-1000-batch-002
