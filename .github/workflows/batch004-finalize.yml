name: Batch 004 Finalize

on:
  push:
    branches:
      - build/ui-industry-1000-batch-004-200

permissions:
  contents: write

concurrency:
  group: batch004-write-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Batch 004 branch
        uses: actions/checkout@v4
        with:
          ref: build/ui-industry-1000-batch-004-200
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize Batch 004 metadata contracts
        run: python scripts/batch004_metadata_contract_fix.py

      - name: Prepare deterministic graph and documentation bookkeeping
        run: python scripts/batch004_finalize.py

      - name: Materialize canonical read-only verifier and remove one-time tooling
        run: |
          cat > .github/workflows/verify.yml <<'EOF'
          name: Verify NUI

          on:
            push:
              branches:
                - main
                - "build/**"
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Run unit and contract tests
                  run: PYTHONPATH=src python -m unittest discover -s tests -v

                - name: Generate fresh bounded completion packet
                  run: |
                    PYTHONPATH=src python scripts/nui-release-packet \
                      --output /tmp/nui-v10-completion-packet.json \
                      --revision "$GITHUB_SHA" \
                      --source "GitHub Actions run $GITHUB_RUN_ID"

                - name: Validate repository and exact-revision completion packet
                  run: |
                    PYTHONPATH=src python scripts/nui-validate . \
                      --packet /tmp/nui-v10-completion-packet.json \
                      --revision "$GITHUB_SHA"

                - name: Upload verified completion packet
                  uses: actions/upload-artifact@v4
                  with:
                    name: nui-v10-completion-packet
                    path: /tmp/nui-v10-completion-packet.json
                    if-no-files-found: error
                    retention-days: 90

                - name: Package complete project
                  run: zip -q -r /tmp/Nolane-UI-Intelligence-v10-complete.zip . -x '.git/*'

                - name: Upload complete project archive
                  uses: actions/upload-artifact@v4
                  with:
                    name: nui-v10-complete-project
                    path: /tmp/Nolane-UI-Intelligence-v10-complete.zip
                    if-no-files-found: error
                    retention-days: 90
          EOF
          rm -f scripts/batch004_finalize.py
          rm -f scripts/batch004_metadata_contract_fix.py
          rm -f .github/workflows/batch004-finalize.yml
          rm -f artifacts/README-RECOVERY-NOTE.tmp*

      - name: Run Batch 004 acceptance gate
        run: PYTHONPATH=src python -m unittest tests.test_ui_industry_batch_004 -v

      - name: Run full unit and contract suite — pass one
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build bounded completion packet — pass one
        run: |
          PYTHONPATH=src python scripts/nui-release-packet \
            --output "$RUNNER_TEMP/nui-batch004-packet.json" \
            --revision "$GITHUB_SHA" \
            --source "Batch 004 finalization run $GITHUB_RUN_ID"

      - name: Run canonical validator — pass one
        run: |
          PYTHONPATH=src python scripts/nui-validate . \
            --packet "$RUNNER_TEMP/nui-batch004-packet.json" \
            --revision "$GITHUB_SHA"

      - name: Record verification evidence
        run: |
          mkdir -p artifacts
          cat > artifacts/UI-INDUSTRY-1000-BATCH-004-VERIFICATION.md <<EOF
          # UI Industry 1000 — Batch 004 Verification

          GitHub Actions run: $GITHUB_RUN_ID
          Source head before finalization commit: $GITHUB_SHA

          The final working tree used for this evidence contains 200 Batch 004 skill bodies, a 674-node canonical graph, synchronized README/AGENTS counts, migrated historical count invariants, a read-only canonical verifier, and no Batch 004 construction workflow or finalizer script.

          Pass-one gates completed successfully before this record was written:

          - Batch 004 acceptance suite
          - complete unittest/contract discovery suite
          - bounded completion-packet generation
          - canonical `nui-validate` with the packet bound to the run revision

          The workflow runs the complete suite and validator again after this evidence file exists, so the committed tree itself is verified rather than only a pre-evidence tree.
          EOF

      - name: Run full unit and contract suite — final tree
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Rebuild bounded completion packet — final tree
        run: |
          PYTHONPATH=src python scripts/nui-release-packet \
            --output "$RUNNER_TEMP/nui-batch004-final-packet.json" \
            --revision "$GITHUB_SHA" \
            --source "Batch 004 final-tree verification run $GITHUB_RUN_ID"

      - name: Run canonical validator — final tree
        run: |
          PYTHONPATH=src python scripts/nui-validate . \
            --packet "$RUNNER_TEMP/nui-batch004-final-packet.json" \
            --revision "$GITHUB_SHA"

      - name: Commit verified clean Batch 004 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: finalize UI Industry Batch 004 200-skill expansion"
          git push origin HEAD:build/ui-industry-1000-batch-004-200
