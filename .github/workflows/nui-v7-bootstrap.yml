name: NUI v7 bootstrap

on:
  push:
    branches:
      - build/concrete-craft-authority-v7
    paths:
      - '.nui-v7-ready'

permissions:
  contents: write

jobs:
  materialize-v7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply verified NUI v7 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nui-v7-parts.sha256 <<'EOF'
          11f37941a756faeec81fc9d41aa45e7a3c4e76d04cef9d0986d3c2128706905c  .nui-v7-payload/part-00
          ebf4a54102fae81b4de34d559143c67fed263dd4e3940340d86457c65cee9d15  .nui-v7-payload/part-01
          50f010db2e7b2e66441399ab7be07dc492a3c621206485a54c2cb5787eac611b  .nui-v7-payload/part-02
          21fe2c29d0c8351732c8b79aef1454c379662f56ca9f334841e234d8359aa089  .nui-v7-payload/part-03
          5b744e0c961bff4b53c0ab3c04c99041eb2d6a5640d6f3d662c63804b2728516  .nui-v7-payload/part-04
          f92362ae63c5f0fc527c50cd0670968c111a9303421afafae7647b39486d418e  .nui-v7-payload/part-05
          ad6a0113262c5fdf9e771c2f8f1801476f87c7d357f46eee7347cbedf5bf6c63  .nui-v7-payload/part-06
          455c32a2c340fd4eccd2a3788e44661916d37c6154c0c77e4dc3a3c08949c241  .nui-v7-payload/part-07
          9708cc1f4a8d25bb8824e4ad6f90d635d98cc7b2fbe6ef5e4222ccc49a86d7c7  .nui-v7-payload/part-08
          353e7e19998d4b6c27f64db42df252d08081088bf8fb8566e3c2e0c6403ebfbb  .nui-v7-payload/part-09
          d25e60f2397268cff2690b236050e806f398b6ab6ac4e1be588cfef50a1b5b96  .nui-v7-payload/part-10
          fe1f3bd71cf16479cd38069366d51f7c5ddaf34d880cc465b21f090113d61f6a  .nui-v7-payload/part-11
          837f1f046f3163934ae93a6a650d66f9a1dec7a69f7351726cdc0184c41c5456  .nui-v7-payload/part-12
          EOF
          sha256sum -c /tmp/nui-v7-parts.sha256
          cat .nui-v7-payload/part-{00..12} > /tmp/nui-v7.patch.xz.b64
          echo "ab857936d9ee3f4e5d742b8d425dacd7dc50c1b5a491c8f1ee196a33febaecec  /tmp/nui-v7.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/nui-v7.patch.xz.b64 > /tmp/nui-v7.patch.xz
          echo "6ed4c42574ce1158d974e41eacda17b4eaffc0d5479b599c82a6ae443dfbfbd8  /tmp/nui-v7.patch.xz" | sha256sum -c -
          xz -t /tmp/nui-v7.patch.xz
          xz -dc /tmp/nui-v7.patch.xz > /tmp/nui-v7.patch
          echo "3b7d6f9738a3f0481658b2a45db766bfb43de6791b9f1243d13747502c779fd1  /tmp/nui-v7.patch" | sha256sum -c -
          git apply --check /tmp/nui-v7.patch
          git apply /tmp/nui-v7.patch
          rm -rf .nui-v7-payload .nui-v7-payload.xz.b64
          git config user.name "Nolane v7 bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: NUI v7 Concrete Craft & Authority Intelligence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
