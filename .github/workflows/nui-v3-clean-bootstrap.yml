name: NUI v3 clean bootstrap

on:
  push:
    branches:
      - build/ui-closure-intelligence-v3-clean

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified v3 delta
        shell: bash
        run: |
          cat .nui-v3-delta.part* > /tmp/nui-v3-delta.b64
          base64 -d /tmp/nui-v3-delta.b64 > /tmp/nui-v3-delta.tar.gz
          echo "d5aca15a72d88b7a2e6dd117bf07b35891d3011f6ea40538fa1d1d3c1b75050f  /tmp/nui-v3-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nui-v3-delta.tar.gz -C .
          rm -f .nui-v3-delta.part*
          rm -f .github/workflows/nui-v3-clean-bootstrap.yml

      - name: Verify clean v3 snapshot
        shell: bash
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python scripts/nui-validate .

      - name: Commit clean v3 tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No v3 changes to commit"; exit 1; }
          git commit -m "feat: add product closure and visual learning intelligence v3"
          git push origin HEAD:build/ui-closure-intelligence-v3-clean
