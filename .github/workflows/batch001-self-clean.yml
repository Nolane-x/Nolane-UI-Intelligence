name: Batch 001 Self Clean

on:
  push:
    branches:
      - build/ui-industry-1000-batch-001
    paths:
      - .github/workflows/batch001-self-clean.yml

permissions:
  contents: write

jobs:
  finalize-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ui-industry-1000-batch-001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply the explicit documentation finalizer
        run: python scripts/batch001_docs_finalize.py

      - name: Run full repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run canonical repository validator
        run: python scripts/nui-validate .

      - name: Commit final docs and remove all one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/research/SOURCES.md
          git rm -f scripts/batch001_docs_finalize.py
          git rm -f .github/workflows/batch001-docs-finalize.yml
          git rm -f .github/workflows/batch001-self-clean.yml
          git commit -m "docs: finalize Batch 001 and remove one-time tooling"
          git push origin HEAD:build/ui-industry-1000-batch-001
