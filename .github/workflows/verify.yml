name: Verify NUI

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository and bounded completion packet
        run: python scripts/nui-validate . --packet artifacts/v1-completion-packet.json
