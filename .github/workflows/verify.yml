name: Verify NUI

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Phase 5 live browser dependencies
        run: |
          python -m pip install -e '.[live]'
          python -m playwright install --with-deps chromium

      - name: Run Phase 5 real Chromium smoke gate
        env:
          NUI_REQUIRE_REAL_PLAYWRIGHT: "1"
        run: PYTHONPATH=src python -m unittest tests.test_runtime_v11_playwright_adapter.RuntimeV11PlaywrightRealSmokeTests -v

      - name: Run unit and contract tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Generate fresh bounded completion packet
        run: |
          PYTHONPATH=src python scripts/nui-release-packet \
            --output /tmp/nui-v10-completion-packet.json \
            --revision "$GITHUB_SHA" \
            --source "GitHub Actions run $GITHUB_RUN_ID"

      - name: Validate repository and exact-revision completion packet
        run: |
          PYTHONPATH=src python scripts/nui-validate . \
            --packet /tmp/nui-v10-completion-packet.json \
            --revision "$GITHUB_SHA"

      - name: Upload verified completion packet
        uses: actions/upload-artifact@v4
        with:
          name: nui-v10-completion-packet
          path: /tmp/nui-v10-completion-packet.json
          if-no-files-found: error
          retention-days: 90

      - name: Package complete project
        run: zip -q -r /tmp/Nolane-UI-Intelligence-v10-complete.zip . -x '.git/*'

      - name: Upload complete project archive
        uses: actions/upload-artifact@v4
        with:
          name: nui-v10-complete-project
          path: /tmp/Nolane-UI-Intelligence-v10-complete.zip
          if-no-files-found: error
          retention-days: 90
