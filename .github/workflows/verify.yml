name: Verify NUI

on:
  push:
    branches:
      - build/ui-industry-1000-batch-003

permissions:
  contents: write

jobs:
  integrate-batch-003:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Batch 003 branch
        uses: actions/checkout@v4
        with:
          ref: build/ui-industry-1000-batch-003

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate deterministic Batch 003 graph metadata
        run: python scripts/batch003_graph_integrate.py

      - name: Run Batch 003 acceptance contract on integrated working tree
        run: PYTHONPATH=src python -m unittest tests.test_ui_industry_batch_003 -v

      - name: Commit graph only after acceptance passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/skill-graph.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate UI Industry Batch 003 into canonical graph"
          git push origin HEAD:build/ui-industry-1000-batch-003
