name: Verify NUI

on:
  push:
    branches:
      - build/ui-industry-1000-batch-004-200
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

jobs:
  finalize-batch-004:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Batch 004 head
        uses: actions/checkout@v4
        with:
          ref: build/ui-industry-1000-batch-004-200
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare deterministic Batch 004 bookkeeping
        run: python scripts/batch004_finalize.py

      - name: Restore canonical verifier and remove one-time tooling
        run: |
          git show origin/main:.github/workflows/verify.yml > .github/workflows/verify.yml
          rm -f .github/workflows/batch004-finalize.yml
          rm -f scripts/batch004_finalize.py

      - name: Run Batch 004 acceptance gate
        run: PYTHONPATH=src python -m unittest tests.test_ui_industry_batch_004 -v

      - name: Run complete repository tests — pass one
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Generate completion packet — pass one
        run: |
          PYTHONPATH=src python scripts/nui-release-packet \
            --output /tmp/nui-b004-packet.json \
            --revision "$GITHUB_SHA" \
            --source "Batch 004 clean-tree finalization run $GITHUB_RUN_ID"

      - name: Validate repository — pass one
        run: |
          PYTHONPATH=src python scripts/nui-validate . \
            --packet /tmp/nui-b004-packet.json \
            --revision "$GITHUB_SHA"

      - name: Record Batch 004 verification evidence
        run: |
          mkdir -p artifacts
          cat > artifacts/UI-INDUSTRY-1000-BATCH-004-VERIFICATION.md <<EOF
          # UI Industry 1000 — Batch 004 Verification

          GitHub Actions run: $GITHUB_RUN_ID
          Source revision entering finalization: $GITHUB_SHA

          Batch 004 contains 200 independently authored skill bodies across ten courts. Deterministic automation was restricted to graph/document bookkeeping. Before this evidence file was created, the Batch 004 acceptance gate, full repository unittest/contract suite, completion-packet generation, and canonical validator all succeeded on a tree where the temporary Batch 004 workflow and finalizer script had already been removed and the canonical verifier had been restored from main.

          The workflow executes the full suite and validator a second time after this evidence file exists, so the exact committed content receives the final gate.
          EOF

      - name: Run complete repository tests — exact final tree
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Generate completion packet — exact final tree
        run: |
          PYTHONPATH=src python scripts/nui-release-packet \
            --output /tmp/nui-b004-final-packet.json \
            --revision "$GITHUB_SHA" \
            --source "Batch 004 exact-final-tree run $GITHUB_RUN_ID"

      - name: Validate repository — exact final tree
        run: |
          PYTHONPATH=src python scripts/nui-validate . \
            --packet /tmp/nui-b004-final-packet.json \
            --revision "$GITHUB_SHA"

      - name: Commit verified Batch 004 final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: finalize UI Industry Batch 004 200-skill expansion"
          git push origin HEAD:build/ui-industry-1000-batch-004-200
