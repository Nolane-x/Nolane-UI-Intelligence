name: Verify NUI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-batch-003-finalization:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate deterministic Batch 003 graph metadata in workspace only
        run: python scripts/batch003_graph_integrate.py

      - name: Finalize deterministic Batch 003 documentation and historical test bookkeeping
        run: python scripts/batch003_finalize_bookkeeping.py

      - name: Run full unit and contract test suite on finalized workspace
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Generate fresh bounded completion packet
        run: |
          PYTHONPATH=src python scripts/nui-release-packet \
            --output "$RUNNER_TEMP/nui-v10-completion-packet.json" \
            --revision "$GITHUB_SHA" \
            --source "Batch 003 finalization artifact from GitHub Actions run $GITHUB_RUN_ID"

      - name: Validate finalized repository workspace
        run: |
          PYTHONPATH=src python scripts/nui-validate . \
            --packet "$RUNNER_TEMP/nui-v10-completion-packet.json" \
            --revision "$GITHUB_SHA"

      - name: Stage verified Batch 003 finalization payload
        run: |
          OUT="$RUNNER_TEMP/batch003-finalization"
          mkdir -p "$OUT/docs/research" "$OUT/skills" "$OUT/tests"
          cp skills/skill-graph.json "$OUT/skills/skill-graph.json"
          cp README.md README-VN.md README-CN.md AGENTS.md "$OUT/"
          cp tests/test_ui_industry_batch_002.py "$OUT/tests/test_ui_industry_batch_002.py"
          cp docs/research/UI-INDUSTRY-1000-BATCH-003.md "$OUT/docs/research/UI-INDUSTRY-1000-BATCH-003.md"
          cp "$RUNNER_TEMP/nui-v10-completion-packet.json" "$OUT/nui-v10-completion-packet.json"

      - name: Upload verified Batch 003 finalization payload
        uses: actions/upload-artifact@v4
        with:
          name: batch003-verified-finalization
          path: ${{ runner.temp }}/batch003-finalization
          if-no-files-found: error
          retention-days: 7
