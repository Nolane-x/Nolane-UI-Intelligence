name: Verify NUI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-batch-003-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate deterministic Batch 003 graph metadata in workspace only
        run: python scripts/batch003_graph_integrate.py

      - name: Run Batch 003 acceptance contract on integrated workspace
        run: PYTHONPATH=src python -m unittest tests.test_ui_industry_batch_003 -v

      - name: Upload verified canonical graph candidate
        uses: actions/upload-artifact@v4
        with:
          name: batch003-verified-graph
          path: skills/skill-graph.json
          if-no-files-found: error
          retention-days: 7
