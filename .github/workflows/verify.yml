name: Verify NUI

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize Batch 002 count and provenance documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/build/ui-industry-1000-batch-002'
        run: |
          python scripts/batch002_docs_finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-VN.md README-CN.md AGENTS.md
          git commit -m "docs: align Batch 002 canonical graph documentation"
          git push origin HEAD:build/ui-industry-1000-batch-002

      - name: Run unit and contract tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Generate fresh bounded completion packet
        run: |
          PYTHONPATH=src python scripts/nui-release-packet \
            --output /tmp/nui-v10-completion-packet.json \
            --revision "$GITHUB_SHA" \
            --source "GitHub Actions run $GITHUB_RUN_ID"

      - name: Validate repository and exact-revision completion packet
        run: |
          PYTHONPATH=src python scripts/nui-validate . \
            --packet /tmp/nui-v10-completion-packet.json \
            --revision "$GITHUB_SHA"

      - name: Upload verified completion packet
        uses: actions/upload-artifact@v4
        with:
          name: nui-v10-completion-packet
          path: /tmp/nui-v10-completion-packet.json
          if-no-files-found: error
          retention-days: 90

      - name: Package complete project
        run: zip -q -r /tmp/Nolane-UI-Intelligence-v10-complete.zip . -x '.git/*'

      - name: Upload complete project archive
        uses: actions/upload-artifact@v4
        with:
          name: nui-v10-complete-project
          path: /tmp/Nolane-UI-Intelligence-v10-complete.zip
          if-no-files-found: error
          retention-days: 90